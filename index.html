<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="家帳本">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // 在畫面出現前套用外觀設定，避免閃一下預設顏色
    try { var s = JSON.parse(localStorage.getItem('homebook.settings') || '{}');
      if (s.theme && s.theme !== 'auto') document.documentElement.dataset.theme = s.theme;
      if (s.accent) document.documentElement.dataset.accent = s.accent; } catch (e) {}
  </script>
  <title>家帳本 HomeBook</title>
</head>
<body>
  <main id="view"><p class="center muted" style="padding-top:40vh">載入中…</p></main>
  <button id="fab" aria-label="新增">＋</button>
  <nav id="tabs">
    <button data-act="tab" data-v="today" class="on"><span>🏠</span>今天</button>
    <button data-act="tab" data-v="all"><span>🔍</span>搜尋</button>
    <button data-act="tab" data-v="rp"><span>🧧</span>紅包</button>
    <button data-act="tab" data-v="settings"><span>⚙️</span>設定</button>
  </nav>
  <div id="sheet-root"></div>
  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
